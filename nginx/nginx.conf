# ═══════════════════════════════════════════════════════════════
# CollabSync nginx configuration
#
# Role: reverse-proxy and round-robin load balancer in front of
#       two CollabSync backend instances.
#
# WHY nginx (not the Docker Compose expose directly)?
# ─────────────────────────────────────────────────────────────
#  1. Single entry point: clients always connect to :80, not to
#     :3001/:3002 directly. This mirrors production topology.
#  2. WebSocket upgrade: nginx handles the Upgrade header rewrite
#     so backend instances see clean WebSocket connections.
#  3. Future TLS: adding HTTPS is one `listen 443 ssl` block here,
#     not a change to every backend instance.
# ═══════════════════════════════════════════════════════════════

events {
  # worker_connections: maximum simultaneous connections per worker.
  # 1024 is the nginx default and sufficient for local testing.
  worker_connections 1024;
}

http {

  # ── Upstream pool: the two backend instances ───────────────
  upstream collabsync_backend {
    # WHY plain round-robin (not ip_hash)?
    # ip_hash would give each client "sticky" affinity to one server,
    # which masks the very behaviour we're testing (cross-instance sync).
    # Round-robin forces clients to land on DIFFERENT instances, proving
    # that the Redis adapter is doing the work.
    #
    # CAVEAT: Socket.io's HTTP long-polling creates a session (sid) that
    # must stay on one server. Round-robin breaks long-polling without
    # sticky sessions. We resolve this by configuring clients to use
    # WebSocket-only transport (transports: ['websocket']), skipping
    # long-polling entirely. See demo/cross-instance-test.js.
    # If you need long-polling support, add: hash $remote_addr consistent;
    server server1:3001;
    server server2:3001;

    # WHY keepalive?
    # Reusing upstream TCP connections for multiple HTTP requests avoids
    # the 3-way handshake overhead on every Socket.io polling request.
    # For WebSocket traffic, one TCP connection per client is kept alive
    # for the session duration — keepalive applies to the HTTP phase.
    keepalive 32;
  }

  # ── Main server block ──────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # ── WebSocket and HTTP proxy settings ───────────────────
    location / {
      proxy_pass http://collabsync_backend;

      # WHY proxy_http_version 1.1?
      # WebSocket requires HTTP/1.1. nginx's default is HTTP/1.0,
      # which does not support persistent connections or the Upgrade
      # mechanism. Without this line, the WebSocket handshake fails.
      proxy_http_version 1.1;

      # WHY these two headers?
      # The WebSocket upgrade is negotiated via:
      #   Client → nginx: "Upgrade: websocket", "Connection: Upgrade"
      #   nginx  → backend: (forwarded) same headers
      # $http_upgrade is the value from the client request ("websocket"
      # or "" for plain HTTP). By echoing it, nginx becomes transparent
      # to the WebSocket protocol handshake.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Pass the real client IP so backend logs show actual clients,
      # not the nginx container IP (172.x.x.x).
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WHY proxy_read_timeout 86400s?
      # WebSocket connections are long-lived (hours to days for active
      # collaboration sessions). nginx's default read timeout is 60 s —
      # it would kill idle WebSocket connections after 60 s of no data.
      # Socket.io sends periodic pings (every 25 s by default) to keep
      # connections alive, but a conservative 24-hour timeout ensures
      # nginx never races with the ping interval.
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      # WHY proxy_buffering off?
      # Socket.io's long-polling sends chunked responses. With buffering
      # enabled, nginx waits for the full chunk before forwarding —
      # adding latency. Disabling it makes nginx forward data as soon
      # as the backend sends it, which is critical for the "real-time"
      # feel of presence updates and cursor positions.
      proxy_buffering off;
    }

    # ── Health endpoint for the load balancer itself ─────────
    location /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
